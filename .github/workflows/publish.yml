name: Publish

on:
  push:
    tags:
      - 'v*'

env:
  # Pinned: an unpinned npx resolves the newest release at run time, so a
  # breaking one would break releases with no change here.
  VSCE: '@vscode/vsce@3.9.2'
  OVSX: 'ovsx@1.1.1'

# A second tag must not cancel a publish that is mid-flight: the VSIX may
# already be on one registry and not the other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    # contents: write is what action-gh-release needs to attach the VSIX. The
    # repository default is already write, but naming id-token here narrows
    # every other scope to none, so it has to be restated.
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: npm
    - run: npm ci
    - name: Check the tag matches package.json
      run: |
        tag="${GITHUB_REF_NAME#v}"
        version="$(node -p "require('./package.json').version")"
        if [ "$tag" != "$version" ]; then
          echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
          exit 1
        fi
    - name: Package
      run: npx --yes "$VSCE" package --out vscode-esbmc.vsix
    # Entra ID rather than a personal access token: Azure DevOps retires global
    # PATs on 2026-12-01, and "All accessible organizations" -- the scope the
    # Marketplace docs ask for -- is exactly what is being retired. Needs an app
    # registration whose federated credential trusts this repository, with its
    # service principal added as an esbmc Marketplace publisher.
    - name: Sign in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        # Publishing needs a Marketplace publisher, not an Azure subscription.
        allow-no-subscriptions: true
    - name: Publish to the VS Code Marketplace
      run: npx --yes "$VSCE" publish --packagePath vscode-esbmc.vsix --azure-credential
    - name: Publish to Open VSX
      run: npx --yes "$OVSX" publish vscode-esbmc.vsix
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
    - name: Attach the VSIX to the release
      uses: softprops/action-gh-release@v3
      with:
        files: vscode-esbmc.vsix
